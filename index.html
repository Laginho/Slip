<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Injected from SURFACE and SURFACE_DARK in src/palette.ts by vite.config.ts. -->
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="%THEME_COLOR_DARK%" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Slip</title>
    <style>
      /* Reset and layout only. Every colour lives in src/palette.ts. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        /* Capture must never be scrolled away from; the list scrolls, the page does not. */
        overflow: hidden;
        /* A pasted URL or boleto number has no space to wrap at. Inherited, so one
           declaration covers the phone bubble, the wall square and the Archive row.
           `anywhere` rather than `break-word` so the intrinsic minimum shrinks too:
           a long token cannot widen a grid track or a flex item before it breaks. */
        overflow-wrap: anywhere;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      input {
        font: inherit;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
