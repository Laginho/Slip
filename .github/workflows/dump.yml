name: Nightly tasks dump

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump tasks table
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "no SUPABASE_DB_URL secret; skipping"
            exit 0
          fi
          if ! command -v pg_dump >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_dump "$SUPABASE_DB_URL" --no-owner --data-only --table=public.tasks \
            > "tasks-$(date -u +%F).sql"
          echo "dumped=true" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: steps.dump.outputs.dumped == 'true'
        with:
          name: tasks-dump
          path: tasks-*.sql
          retention-days: 14
